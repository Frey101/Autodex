name: CI / CD Autodex

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Selectionner Xcode (dernière version disponible)
        run: |
          XCODE_DIR=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_DIR" ]; then
            XCODE_DIR="/Applications/Xcode.app"
          fi
          echo "Sélection de Xcode: $XCODE_DIR"
          sudo xcode-select -s "$XCODE_DIR/Contents/Developer"
          xcodebuild -version

      - name: Cache des packages SPM (Firebase & GoogleSignIn)
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-spm-${{ hashFiles('Autodex.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Compilation et Tests Unitaires
        run: |
          SIMULATOR_UDID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable and (.name | contains("iPhone"))) | .udid' | head -n 1)
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "Aucun simulateur iPhone trouvé"
            exit 1
          fi
          echo "Simulateur cible UDID: $SIMULATOR_UDID"

          xcodebuild test \
            -project Autodex.xcodeproj \
            -scheme Autodex \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:AutodexTests \
            -configuration Debug \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Compression en ZIP
        run: |
          cd build/Build/Products/Debug-iphonesimulator/
          zip -r autodex-simulator.zip Autodex.app

      - name: Exporter l'artefact de Build
        uses: actions/upload-artifact@v4
        with:
          name: autodex-simulator
          path: build/Build/Products/Debug-iphonesimulator/autodex-simulator.zip

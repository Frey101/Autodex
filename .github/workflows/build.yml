name: CI / CD Autodex

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Selectionner Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer

      - name: Compilation et Tests
        run: |
          xcodebuild build-for-testing \
            -project Autodex.xcodeproj \
            -scheme Autodex \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Compression en ZIP
        run: |
          cd build/Build/Products/Debug-iphonesimulator/
          zip -r autodex-simulator.zip Autodex.app

      - name: Exporter l'artefact de Build
        uses: actions/upload-artifact@v4
        with:
          name: autodex-simulator
          path: build/Build/Products/Debug-iphonesimulator/autodex-simulator.zip

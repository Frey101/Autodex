name: CI / CD Autodex

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Selectionner Xcode (dernière version disponible)
        run: |
          XCODE_DIR=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_DIR" ]; then
            XCODE_DIR="/Applications/Xcode.app"
          fi
          echo "Sélection de Xcode: $XCODE_DIR"
          sudo xcode-select -s "$XCODE_DIR/Contents/Developer"
          xcodebuild -version

      - name: Compilation et Tests Unitaires
        run: |
          SIMULATOR_NAME=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable and (.name | contains("iPhone"))) | .name' | head -n 1)
          if [ -z "$SIMULATOR_NAME" ]; then
            SIMULATOR_NAME="iPhone 16"
          fi
          echo "Simulateur cible: $SIMULATOR_NAME"

          xcodebuild test \
            -project Autodex.xcodeproj \
            -scheme Autodex \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -only-testing:AutodexTests \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Compression en ZIP
        run: |
          cd build/Build/Products/Debug-iphonesimulator/
          zip -r autodex-simulator.zip Autodex.app

      - name: Exporter l'artefact de Build
        uses: actions/upload-artifact@v4
        with:
          name: autodex-simulator
          path: build/Build/Products/Debug-iphonesimulator/autodex-simulator.zip
